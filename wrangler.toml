# Cloudflare Pages project configuration (used by the GitHub integration and by `wrangler pages dev`).
name = "goodspan-pando"
pages_build_output_dir = "public"
compatibility_date = "2025-07-01"

[vars]
SITE_URL = "https://pando.thegoodspan.com" # where this site is served, no trailing slash
SUPABASE_URL = "https://stnfijxgtjsmbxeahdxc.supabase.co" # Supabase → Project Settings → API → Project URL
EMAIL_FROM = "The Good Span <pando@thegoodspan.com>" # must be on a domain verified in Resend
EMAIL_REPLY_TO = "hello@thegoodspan.com"
MODEL_CHAT = "claude-haiku-5-5"                      # fast model for the conversation
MODEL_REPORT = "claude-sonnet-5-5"                   # stronger model for the report
MODEL_TRANSCRIBE = "gpt-4o-mini-transcribe"          # voice messages
COACH_ALERT_EMAIL = ""                               # optional: who gets emailed about red flags

# Secrets are NOT stored here. Add them in the Cloudflare dashboard (see README):
# ANTHROPIC_API_KEY, OPENAI_API_KEY, SUPABASE_SECRET_KEY, RESEND_API_KEY, SESSION_SECRET, TURNSTILE_SECRET
